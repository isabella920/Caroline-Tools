<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>可蘿嵐的小箱箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="app/index/src/assets/style.css">
    <style>
        /* 基礎重置：防止手機版出現奇怪的滾動條 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow-x: hidden;
        }

        /* 固定背景層：物理釘死背景，解決手機縮放問題 */
        .fixed-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        .bg-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3); /* 遮罩暗度 */
            backdrop-filter: blur(2px); /* 輕微模糊背景圖增加質感 */
        }
    </style>
</head>
<body class="antialiased text-white">

    <div class="fixed-bg">
        <div class="bg-overlay"></div>
    </div>

    <main class="min-h-screen w-full flex flex-col items-center justify-center p-4 md:p-10">
        
        <div class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-10">
            
            <section id="hero-container" class="lg:col-span-5 glass-panel p-8 rounded-3xl min-h-[400px] flex flex-col justify-between">
                </section>

            <section class="lg:col-span-7 flex flex-col space-y-6 lg:space-y-8">
                <div id="nav-grid-container"></div>

                <div class="glass-panel p-8 rounded-3xl flex-1 flex flex-col relative shadow-xl">
                    <h2 class="text-white text-xl font-bold mb-6 flex items-center">
                        <i data-lucide="compass" class="w-6 h-6 mr-3 text-white/70"></i> 網站列表
                    </h2>
                    <div id="tool-gallery" class="gallery-scroll flex overflow-x-auto gap-6 pb-4 hide-scrollbar">
                        </div>
                </div>
            </section>

        </div>
    </main>

    <script src="app/index/src/main.js" type="module"></script>
</body>
</html>
