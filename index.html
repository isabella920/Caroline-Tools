<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可蘿嵐的小箱箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="app/index/src/assets/style.css">
    <style>
        body { background-image: url('https://images.unsplash.com/photo-1506744626753-dba37c1528fb?q=80&w=2070&auto=format&fit=crop'); }
    </style>
</head>
<body class="min-h-screen bg-cover bg-center bg-no-repeat bg-fixed flex items-center justify-center p-4 md:p-8">
    
    <main class="glass-container w-full max-w-6xl rounded-3xl p-6 md:p-10 grid grid-cols-1 lg:grid-cols-12 gap-8 shadow-2xl">
        
        <section class="lg:col-span-5 flex flex-col justify-between space-y-8">
            <div>
                <div id="secret-trigger" class="glass-panel inline-flex p-4 rounded-2xl mb-6 cursor-pointer hover:bg-white/20 transition">
                    <i data-lucide="clock" class="w-10 h-10 text-white"></i>
                </div>
                <h1 class="text-4xl md:text-5xl font-black text-white tracking-tight mb-3 drop-shadow-md">
                    可蘿嵐的小箱箱
                </h1>
                <p class="text-white/80 text-lg">存活於互聯網邊緣的實用小站</p>
            </div>

            <div class="glass-panel p-6 rounded-2xl border-l-4 border-white">
                <p class="text-white/90 italic leading-relaxed">
                    "Hello World! <br> 讓複雜的工具，回歸最純粹的點擊。"
                </p>
            </div>
        </section>

        <section class="lg:col-span-7 flex flex-col space-y-6">
            
            <div class="grid grid-cols-2 gap-4">
                <div class="glass-panel p-6 rounded-2xl flex flex-col items-center justify-center text-white/50 min-h-[120px] border border-white/10 border-dashed">
                    <i data-lucide="layout-template" class="w-8 h-8 mb-2"></i>
                    <span class="text-sm font-bold tracking-widest">COMING SOON</span>
                </div>
                <div class="glass-panel p-6 rounded-2xl flex flex-col items-center justify-center text-white/50 min-h-[120px] border border-white/10 border-dashed">
                    <i data-lucide="sparkles" class="w-8 h-8 mb-2"></i>
                    <span class="text-sm font-bold tracking-widest">COMING SOON</span>
                </div>
            </div>

            <div class="glass-panel p-6 rounded-2xl flex-1 flex flex-col relative">
                <h2 class="text-white font-bold mb-4 flex items-center">
                    <i data-lucide="compass" class="w-5 h-5 mr-2"></i> 網站列表
                </h2>
                
                <div id="tool-gallery" class="gallery-scroll flex overflow-x-auto gap-4 pb-4 snap-x snap-mandatory hide-scrollbar">
                    </div>

                <div id="gallery-pagination" class="flex justify-center mt-auto pt-2 gap-2">
                    </div>
            </div>

        </section>
    </main>

    <script type="module" src="app/index/src/main.js"></script>
</body>
</html>
