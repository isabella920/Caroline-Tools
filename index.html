<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可蘿嵐的小箱箱</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="app/index/src/assets/style.css">

    <style>
        /* 補上背景圖 */
        body {
			margin: 0;
			padding: 0;
			/* 修正 iOS 滾動時的橡皮筋特效導致背景露白 */
			background-color: #1a1a1a; 
		}

			.main-wrapper {
			/* 核心修復：確保在手機上高度正確，且內容居中 */
			min-height: 100vh;
			min-height: -webkit-fill-available; /* 關鍵：解決 iOS 網址列遮擋 */
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 2rem;
			position: relative;
			z-index: 10; /* 確保內容在背景 div 之上 */
			}

/* 玻璃擬態優化：增加 GPU 加速，防止手機捲動時閃爍 */
.glass-panel, .glass-container {
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    transform: translateZ(0); /* 觸發硬體加速 */
}
    </style>
</head>
<body class="antialiased">
    <div class="fixed inset-0 -z-50 w-full h-full overflow-hidden">
        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center"></div>
        <div class="absolute inset-0 bg-black/30"></div>
    </div>

    <main class="main-wrapper w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-10 mx-auto">
        <section id="hero-container" ...></section>
        <section class="lg:col-span-7 flex flex-col space-y-8">
            <div id="nav-grid-container"></div>
            <div class="glass-panel ...">
                ...
                <div id="tool-gallery" ...></div>
            </div>
        </section>
    </main>

    <script src="app/index/src/main.js" type="module"></script>
</body>
</html>
