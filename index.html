<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>可蘿嵐的小箱箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="app/index/src/assets/style.css">
    <style>
        /* 這裡只留最基礎的修正，其餘進 style.css */
        body { margin: 0; background-color: #000; }
        .bg-fixed-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="antialiased text-white">

    <div class="bg-fixed-layer">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]"></div>
    </div>

    <main class="main-wrapper">
        <div class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-10">
            <section id="hero-container" class="lg:col-span-5 glass-panel p-8 rounded-3xl h-full flex flex-col justify-between">
                </section>

            <section class="lg:col-span-7 flex flex-col space-y-8">
                <div id="nav-grid-container"></div>
                <div class="glass-panel p-8 rounded-3xl flex-1 flex flex-col relative shadow-xl">
                    <h2 class="text-white text-xl font-bold mb-6 flex items-center">
                        <i data-lucide="compass" class="w-6 h-6 mr-3 text-white/70"></i> 網站列表
                    </h2>
                    <div id="tool-gallery" class="gallery-scroll flex overflow-x-auto gap-6 pb-4 hide-scrollbar">
                        </div>
                </div>
            </section>
        </div>
    </main>

    <script src="app/index/src/main.js" type="module"></script>
</body>
</html>
