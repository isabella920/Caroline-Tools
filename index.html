<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>可蘿嵐的小箱箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="app/index/src/assets/style.css">
    <style>
        /* 1. 物理背景層：釘死在螢幕最底層，解決手機版背景失效 */
        .fixed-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000;
        }

        /* 2. 背景遮罩：增加玻璃感 */
        .bg-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
        }

        /* 3. 解決 iOS 滾動條露白問題 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: transparent;
        }
    </style>
</head>
<body class="antialiased text-white">

    <div class="fixed-background">
        <div class="bg-overlay"></div>
    </div>

    <main class="min-h-screen w-full flex items-center justify-center p-6 md:p-12">
        
        <div class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12">
            
            <section id="hero-container" class="lg:col-span-5 glass-panel p-8 rounded-3xl min-h-[450px] flex flex-col justify-between shadow-2xl">
                </section>

            <section class="lg:col-span-7 flex flex-col space-y-8">
                <div id="nav-grid-container"></div>


                <div class="glass-panel p-8 rounded-3xl flex flex-col relative shadow-2xl h-[480px]">
                    <h2 class="text-white text-xl font-bold mb-6 flex items-center">
                        <i data-lucide="layout-grid" class="w-6 h-6 mr-2"></i>
                        網站列表
                    </h2>
                    
                    <div id="tool-gallery" class="grid grid-cols-2 md:grid-cols-3 gap-6 pb-4 items-start flex-1 content-start">
                        </div>
                                    
                    <div id="gallery-pagination" class="flex justify-center items-center gap-3 mt-auto pt-4">
                        </div>
                </div>
            </section>

        </div>
    </main>

    <script src="app/index/src/main.js" type="module"></script>
</body>
</html>
