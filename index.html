<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>可蘿嵐的小箱箱</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="app/index/src/assets/style.css">

    <style>
        /* 1. 物理背景層：釘死在螢幕最底層，解決手機版背景失效 */
        .fixed-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 2. 背景遮罩：增加玻璃感 */
        .bg-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
        }

        /* 3. 解決 iOS 滾動條露白問題 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: #000;
        }
    </style>
</head>
<body class="antialiased">
    <div class="fixed-bg-layer"></div>

    <main class="main-layout-container">
        <div class="content-grid">
            <section id="hero-container" class="glass-panel lg:col-span-5"></section>
            <section class="lg:col-span-7 flex flex-col space-y-8">
                <div id="nav-grid-container"></div>
                <div class="glass-panel p-8 rounded-3xl flex-1">
                    <div id="tool-gallery" class="gallery-scroll flex overflow-x-auto gap-6 hide-scrollbar"></div>
                </div>
            </section>
        </div>
    </main>

    <script src="app/index/src/main.js" type="module"></script>
</body>
</html>
